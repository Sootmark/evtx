[package]
name = "evtx"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Windows Event Log (.evtx) parser: file and chunk headers, BinXML, templates, typed values."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/evtx"
publish = false

[dependencies]
common = { git = "ssh://git@github.com/Sootmark/common.git", tag = "v0.1.0", version = "0.1.0" }
crc32fast = "1"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
