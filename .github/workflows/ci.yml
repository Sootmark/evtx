name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Test on every open log
        run: |
          dir="$RUNNER_TEMP/evtx"
          mkdir -p "$dir"
          curl -sSfL https://codeload.github.com/mdecrevoisier/EVTX-to-MITRE-Attack/tar.gz/474856008f037ccd42753f02a631b42690195829 | tar -xz -C "$dir"
          curl -sSfL https://codeload.github.com/omerbenamram/evtx/tar.gz/f0723198e50ae73de83ce4f2f1734fe3f6db5506 | tar -xz -C "$dir" --wildcards '*/samples/*'
          SOOTMARK_EVTX_CC0="$dir/EVTX-to-MITRE-Attack-474856008f037ccd42753f02a631b42690195829" \
          SOOTMARK_EVTX_SAMPLES="$dir/evtx-f0723198e50ae73de83ce4f2f1734fe3f6db5506/samples" \
            cargo test --locked --release --test open_samples
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
